$kind: http-request
url: http://127.0.0.1:8000/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"usuario.teste.qa@example.com\",\r

    \    \"password\": \"SenhaTeste123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Second user received a valid token\", function () {\r

      \    pm.expect(response.access_token).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(response.token_type).to.eql(\"bearer\");\r

      });\r

      \r

      pm.collectionVariables.set(\"second_user_token\", response.access_token);"
    language: text/javascript
order: 9000
