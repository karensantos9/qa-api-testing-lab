$kind: http-request
url: http://127.0.0.1:8000/users
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Users contain expected fields\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.forEach(user => {\r

      \        pm.expect(user).to.have.property(\"id\");\r

      \        pm.expect(user).to.have.property(\"name\");\r

      \        pm.expect(user).to.have.property(\"email\");\r

      \        pm.expect(user).to.have.property(\"role\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Password is not returned\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.forEach(user => {\r

      \        pm.expect(user).to.not.have.property(\"password\");\r

      \        pm.expect(user).to.not.have.property(\"password_hash\");\r

      \    });\r

      });"
    language: text/javascript
order: 4503506971284241
