$kind: http-request
url: ""
method: PUT
body:
  type: json
  content: "{\r

    \  \"name\": \"Valid Product\",\r

    \  \"price\": 100,\r

    \  \"stock\": -1\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains validation error\", function () {\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });\r

      \r

      pm.test(\"Validation error identifies the stock field\", function () {\r

      \    pm.expect(response.detail[0].loc).to.include(\"stock\");\r

      });\r

      \r

      pm.test(\"Validation message is correct\", function () {\r

      \    pm.expect(response.detail[0].msg).to.eql(\r

      \        \"Input should be greater than or equal to 0\"\r

      \    );\r

      });"
    language: text/javascript
