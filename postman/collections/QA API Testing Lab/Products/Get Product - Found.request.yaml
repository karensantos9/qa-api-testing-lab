$kind: http-request
url: http://127.0.0.1:8000/products/1
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains product data\", function () {\r

      \    pm.expect(response).to.have.property(\"id\");\r

      \    pm.expect(response).to.have.property(\"name\");\r

      \    pm.expect(response).to.have.property(\"price\");\r

      \    pm.expect(response).to.have.property(\"stock\");\r

      });\r

      \r

      pm.test(\"Product ID is correct\", function () {\r

      \    pm.expect(response.id).to.eql(1);\r

      });"
    language: text/javascript
