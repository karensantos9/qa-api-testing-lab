$kind: http-request
url: http://127.0.0.1:8000/products/1
method: PUT
body:
  type: json
  content: "{\r

    \  \"name\": \"A\",\r

    \  \"price\": 100,\r

    \  \"stock\": 10\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains validation error\", function () {\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });\r

      \r

      pm.test(\"Validation error identifies the name field\", function () {\r

      \    pm.expect(response.detail[0].loc).to.include(\"name\");\r

      });\r

      \r

      pm.test(\"Validation message is correct\", function () {\r

      \    pm.expect(response.detail[0].msg).to.eql(\r

      \        \"String should have at least 2 characters\"\r

      \    );\r

      });"
    language: text/javascript
order: 4503599617184179
