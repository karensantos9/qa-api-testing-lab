$kind: http-request
url: http://127.0.0.1:8000/orders
method: POST
body:
  type: json
  content: "{\r

    \    \"items\": [\r

    \        {\r

    \            \"product_id\": {{product_id}},\r

    \            \"quantity\": -2\r

    \        }\r

    \    ]\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains validation error\", function () {\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });\r

      \r

      pm.test(\"Validation identifies quantity field\", function () {\r

      \    pm.expect(response.detail[0].loc).to.include(\"quantity\");\r

      });\r\n"
    language: text/javascript
order: 5000
