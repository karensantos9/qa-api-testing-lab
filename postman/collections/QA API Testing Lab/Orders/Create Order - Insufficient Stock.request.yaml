$kind: http-request
url: http://127.0.0.1:8000/orders
method: POST
body:
  type: json
  content: "{\r

    \    \"items\": [\r

    \        {\r

    \            \"product_id\": {{product_id}},\r

    \            \"quantity\": 999999\r

    \        }\r

    \    ]\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains insufficient stock error\", function () {\r

      \    pm.expect(response.detail).to.include(\"Insufficient stock\");\r

      });\r\n"
    language: text/javascript
order: 6000
