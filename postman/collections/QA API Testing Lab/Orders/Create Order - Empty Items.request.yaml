$kind: http-request
url: http://127.0.0.1:8000/orders
method: POST
body:
  type: json
  content: "{\r\n    \"items\": []\r\n}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains validation error\", function () {\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      \    pm.expect(response.detail).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Validation identifies items field\", function () {\r

      \    pm.expect(response.detail[0].loc).to.include(\"items\");\r

      });\r\n"
    language: text/javascript
order: 2000
