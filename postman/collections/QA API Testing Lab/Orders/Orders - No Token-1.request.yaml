$kind: http-request
name: Orders - No Token
url: http://127.0.0.1:8000/orders
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Request is rejected without token\", function () {\r

      \    pm.expect(response.detail).to.eql(\"Not authenticated\");\r

      });\r\n"
    language: text/javascript
order: 17676
