      \    pm.expect(response).to.have.property(\"id\");\r

      \    pm.expect(response).to.have.property(\"user_id\");\r

      \    pm.expect(response).to.have.property(\"total\");\r

      \    pm.expect(response).to.have.property(\"items\");\r

      });\r

      \r

      pm.test(\"Returned order ID matches requested ID\", function () {\r

      \    pm.expect(response.id).to.eql(\r

      \        Number(pm.collectionVariables.get(\"order_id\"))\r

      \    );\r

      });\r

      \r

      pm.test(\"Order contains items\", function () {\r

      \    pm.expect(response.items).to.be.an(\"array\").that.is.not.empty;\r

      });\r\n"
    language: text/javascript
order: 9000
