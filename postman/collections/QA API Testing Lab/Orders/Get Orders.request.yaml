$kind: http-request
url: http://127.0.0.1:8000/orders
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Orders contain expected fields\", function () {\r

      \    response.forEach(order => {\r

      \        pm.expect(order).to.have.property(\"id\");\r

      \        pm.expect(order).to.have.property(\"user_id\");\r

      \        pm.expect(order).to.have.property(\"total\");\r

      \        pm.expect(order).to.have.property(\"items\");\r

      \    });\r

      });\r

      \r

      pm.test(\"All orders have a user associated\", function () {\r

      \    response.forEach(order => {\r

      \        pm.expect(order.user_id).to.be.a(\"number\");\r

      \    });\r

      });"
    language: text/javascript
order: 8000
